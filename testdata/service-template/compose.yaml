name: zombie-service-template

services:
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - mkdir -p /var/www/html && chmod 777 /var/www/html && exec redis-server --requirepass zombie_redis_pass --dir /var/www --save "" --appendonly no --enable-protected-configs yes
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "zombie_redis_pass", "PING"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-init:
    image: redis:7-alpine
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        redis-cli -h redis -a zombie_redis_pass SET zombie:template zombie-template-ok &&
        redis-cli -h redis -a zombie_redis_pass SET app:password zombie-secret-pass &&
        redis-cli -h redis -a zombie_redis_pass SET api:token zombie-token &&
        redis-cli -h redis -a zombie_redis_pass SET service:credential zombie-credential
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: zombie
      POSTGRES_PASSWORD: zombie_pg_pass
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zombie -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  mysql:
    image: mysql:8.0
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --secure-file-priv=
    environment:
      MYSQL_ROOT_PASSWORD: zombie_mysql_root
      MYSQL_DATABASE: zombie
      MYSQL_USER: zombie
      MYSQL_PASSWORD: zombie_mysql_pass
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 2s
      timeout: 2s
      retries: 40

  ssh:
    build:
      context: ./ssh
    image: zombie-service-template-ssh:local
    ports:
      - "127.0.0.1:10022:22"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 2s
      retries: 30
