id: local-postgres-smoke
service: [postgresql]
info:
  name: Local PostgreSQL service-template smoke test
  severity: info
  tags: local,docker,postgresql

services:
  - ops:
      - db: "SELECT marker FROM smoke WHERE id = 1"
        name: marker
      - db: "SHOW DATABASES"
        name: databases
    matchers:
      - type: word
        part: marker
        words: ["zombie-postgres-ok"]
    extractors:
      - type: regex
        name: postgres_marker
        part: marker
        regex: ['(?m)^(zombie-postgres-ok)$']
        group: 1
      - type: regex
        name: postgres_database
        part: databases
        regex: ['(?m)^(postgres)$']
        group: 1
